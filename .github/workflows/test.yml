name: "test"

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: "read"

jobs:
  test:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version: "24"
      # The hook tests pin shellcheck 0.11.0; the runner ships an older one.
      - env:
          SHELLCHECK_URL: "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: "curl -fsSL -o $RUNNER_TEMP/shellcheck.tar.xz $SHELLCHECK_URL && echo \"$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.xz\" | sha256sum -c - && tar -xJf $RUNNER_TEMP/shellcheck.tar.xz -C $RUNNER_TEMP && echo $RUNNER_TEMP/shellcheck-v0.11.0 >> $GITHUB_PATH"
      - run: "npm ci"
      - run: "npm test"
